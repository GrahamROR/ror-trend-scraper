name: Monday Shopify Sync

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 6am UTC (7am BST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Shopify catalogue
        env:
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python shopify_sync.py

      - name: Commit catalogue
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add shopify_catalogue.json || true
          git diff --cached --quiet || git commit -m "chore: shopify sync $(date +%Y-%m-%d)"
          git pull --rebase && git push
