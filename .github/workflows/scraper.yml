name: Weekly Trend Scraper

on:
  schedule:
    - cron: "0 7 * * 1"   # Monday 8am UK (BST = UTC+1; covers GMT season too)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Shopify catalogue
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python shopify_sync.py

      - name: Run rank tracker
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          if [ -f search_console_cache.json ] && [ -n "$SERPER_API_KEY" ]; then
            python rank_tracker.py --limit 25 --sleep 0.5
          else
            echo "Skipping rank tracker: search_console_cache.json or SERPER_API_KEY missing"
          fi

      - name: Run trend scraper
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add trend_report.html trend_cache.json layer4_expanded.json shopify_catalogue.json || true
          test -f open_trends.json && git add open_trends.json || true
          git diff --cached --quiet || git commit -m "chore: weekly trend scrape $(date +%Y-%m-%d)"
          git pull --rebase && git push

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trend-report
          path: trend_report.html
          retention-days: 14

      - name: Prepare Pages deploy
        run: mkdir -p _site && cp trend_report.html _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
