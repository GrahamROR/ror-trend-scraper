name: Content Generator

on:
  schedule:
    - cron: "0 7 */2 * *"   # Every other day at 8am UK time
  workflow_dispatch:
    inputs:
      keyword:
        description: "Optional keyword to prioritise, for example embroidered cap"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_KEYWORD: ${{ inputs.keyword }}
        run: python content_generator.py

      - name: Create ClickUp tasks
        env:
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          CLICKUP_LIST_ID: ${{ vars.CLICKUP_LIST_ID }}
        run: python clickup_tasks.py

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add ror_content_draft.md content_history.json || true
          git diff --cached --quiet || git commit -m "chore: content draft $(date +%Y-%m-%d)"
          git pull --rebase && git push

      - name: Prepare Pages deploy
        run: mkdir -p _site && cp trend_report.html _site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
