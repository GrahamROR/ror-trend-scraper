name: Weekly Content Generator

on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesday 7am UTC (8am BST)
  workflow_dispatch:       # Manual trigger any time

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate blogs and emails → push to ClickUp
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          CLICKUP_API_KEY:      ${{ secrets.CLICKUP_API_KEY }}
          CLICKUP_LIST_ID:      ${{ vars.CLICKUP_LIST_ID }}
          CLICKUP_MARKETING_LIST: "901218493661"
          CLICKUP_SEASONAL_LIST:  "901218516109"
          CLICKUP_PRODUCTION_LIST: "901218493701"
          PERPLEXITY_API_KEY:      ${{ secrets.PERPLEXITY_API_KEY }}
        run: python content_generator.py

      - name: Commit history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add content_history.json || true
          git diff --cached --quiet || git commit -m "chore: content history $(date +%Y-%m-%d)"
          git pull --rebase && git push
