name: ROR Weekly Trend Scraper

on:
  schedule:
    # Every Monday at 8am UK time (UTC+1 BST = 7am UTC in summer)
    - cron: '0 7 * * 1'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  scrape-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trend scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      - name: Upload report as artefact
        uses: actions/upload-artifact@v4
        with:
          name: ror-trend-report-${{ github.run_number }}
          path: |
            trend_report.html
            ror_content_draft.md
            trend_cache.json
          retention-days: 30

      - name: Commit outputs back to repo
        run: |
          git config user.name  "ROR Trend Bot"
          git config user.email "bot@rockonruby.co.uk"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add trend_report.html ror_content_draft.md trend_cache.json || true
          git diff --staged --quiet || git commit -m "Weekly trend report $(date +'%Y-%m-%d')"
          git push
